<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deutsch Lernen 德语学习</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0e1a;--card:#141b30;--text:#e0e6f0;--text2:#8a93a8;--border:#2a3350;--accent:#4a7aca}
[data-theme="light"]{--bg:#f4f6fa;--card:#ffffff;--text:#1c2536;--text2:#5c6e88;--border:#cfd8e6;--accent:#3868c8}
body{background:var(--bg);color:var(--text);font-family:-apple-system,Helvetica,Arial,"PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
h1{font-size:28px;margin-bottom:8px}
.sub{color:var(--text2);font-size:14px;margin-bottom:32px}
.grid{display:grid;gap:16px;width:100%;max-width:420px}
a.card{display:block;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px;text-decoration:none;color:var(--text)}
a.card h2{font-size:18px;margin-bottom:6px}
a.card p{font-size:13px;color:var(--text2);line-height:1.6}
a.card:active{transform:scale(.98)}
#themeBtn{position:fixed;top:14px;right:14px;background:var(--card);border:1px solid var(--border);border-radius:50%;width:38px;height:38px;font-size:18px;cursor:pointer}
</style>
</head>
<body>
<button id="themeBtn" onclick="toggleTheme()" title="切换主题">🔄</button>
<h1>Deutsch Lernen</h1>
<div class="sub">德语学习 · 词汇与语法</div>
<div class="grid">
<a class="card" href="a1a2/"><h2>📚 A1-A2 单词星图</h2><p>26 组 · 动词词干+词族+语法星图，三形式+中文+复数</p></a>
<a class="card" href="a1b2/"><h2>📚 A1-B2 单词星图</h2><p>82 组 · 动词词干+词族+语法星图，A1～B2 级别徽章，三形式+中文+复数</p></a>
<a class="card" href="grammatik/"><h2>📖 德语语法 A1-B2</h2><p>23 个语法点，中英对照讲解+例句</p></a>
<a class="card" href="kurs/"><h2>📖 德语课程语法与词汇</h2><p>A1–C1 五个级别 · 按课程实际顺序（M01–M24），中英对照讲解+例句</p></a>
<a class="card" href="nicos/a1/"><h2>🎙️ Nicos Weg A1 词汇</h2><p>1726 词完整版 · 德英中三语+记忆提示，搜索/筛选/发音</p></a>
</div>
<script>
(function(){
  function apply(t){var r=document.documentElement;
    if(t==='auto')r.setAttribute('data-theme',matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
    else r.setAttribute('data-theme',t);
    var b=document.getElementById('themeBtn');if(b)b.textContent=t==='light'?'☀️':t==='dark'?'🌙':'🔄';}
  var cur=localStorage.getItem('delernen-theme')||'auto';apply(cur);
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change',function(){if(cur==='auto')apply('auto');});
  window.toggleTheme=function(){cur=cur==='auto'?'light':cur==='light'?'dark':'auto';localStorage.setItem('delernen-theme',cur);apply(cur);};
})();
</script>
</body>
</html>
