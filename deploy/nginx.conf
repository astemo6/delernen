events {}
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  server {
    listen 127.0.0.1:18095;
    root /usr/share/nginx/delernen;
    index index.html;
    # 所有 index.html 不缓存（避免 iOS 等客户端拿到旧页面）
    location ~ /index\.html$ { add_header Cache-Control "no-cache, no-store, must-revalidate"; try_files $uri =404; }
    # LibreLingo 刷题（目录式导出，无尾斜杠也直接 serve，避免 301 带错端口）
    location /practice/ { try_files $uri $uri/index.html =404; add_header Cache-Control "no-cache, no-store, must-revalidate" always; }
    location / { try_files $uri $uri/ =404; }
  }
}
