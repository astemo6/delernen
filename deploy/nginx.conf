events {}
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  server {
    listen 127.0.0.1:18095;
    root /usr/share/nginx/delernen;
    index index.html;
    # 所有 index.html 不缓存（避免 iOS 等客户端拿到旧页面）
    # 注意：目录式 URL（如 /memorize/）经 index 指令直接 serve，不命中上面的正则，需单独处理
    location ~ /index\.html$ { add_header Cache-Control "no-cache, no-store, must-revalidate" always; try_files $uri =404; }
    location ~ /$ { add_header Cache-Control "no-cache, no-store, must-revalidate" always; try_files $uri $uri/ =404; }
    # 词库 js 经常更新，也不缓存（避免拿到旧数据）
    location ~ \.js$ { add_header Cache-Control "no-cache, no-store, must-revalidate" always; try_files $uri =404; }
    location / { try_files $uri $uri/ =404; }
  }
}
