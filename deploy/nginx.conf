events {}
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  etag on;
  gzip on;
  gzip_types application/javascript application/json text/css;
  server {
    listen 127.0.0.1:18095;
    root /usr/share/nginx/delernen;
    index index.html;
    # 所有 index.html 每次校验（no-cache 仍可 304）（避免 iOS 等客户端拿到旧页面）
    # 注意：目录式 URL（如 /memorize/）经 index 指令直接 serve，不命中上面的正则，需单独处理
    location ~ /index\.html$ { add_header Cache-Control "no-cache" always; try_files $uri =404; }
    location ~ /$ { add_header Cache-Control "no-cache" always; try_files $uri $uri/ =404; }
    # js/json 经常更新：no-cache = 每次用 ETag 向服务器校验，没变就 304，不重复下载
    location ~ \.(js|json)$ { add_header Cache-Control "no-cache" always; try_files $uri =404; }
    location / { try_files $uri $uri/ =404; }
  }
}
